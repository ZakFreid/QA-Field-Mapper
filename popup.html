<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { width: 540px; margin: 0; background: #14181d; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; max-height: 600px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #2a3138; }
  header h1 { font-size: 14px; margin: 0; }
  .bar { padding: 8px 12px; border-bottom: 1px solid #2a3138; }
  #search { width: 100%; box-sizing: border-box; background: #0e1114; color: #eee; border: 1px solid #3a4149; border-radius: 4px; padding: 6px 8px; }
  button { cursor: pointer; background: #232a31; color: #eee; border: 1px solid #3a4149; border-radius: 4px; padding: 5px 9px; }
  button.danger { color: #ff8a80; }
  button.icon { padding: 2px 6px; }
  #list { overflow-y: auto; padding: 6px 8px; }
  .row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 4px; }
  .row:hover { background: #1d242b; }
  .row .main { flex: 1; cursor: pointer; word-break: break-all; }
  .row .key { flex: 1.2; word-break: break-all; }
  .row .key .klabel { font-weight: 600; }
  .row .key .kxpath { color: #7a828a; font-size: 10px; word-break: break-all; margin-top: 2px; }
  .row .val { flex: 1; color: #8be9fd; word-break: break-all; font-family: ui-monospace, monospace; font-size: 12px; }
  .badge { background: #2a3138; border-radius: 10px; padding: 1px 8px; font-size: 11px; }
  .crumbs { display: flex; align-items: center; gap: 8px; padding: 4px 2px 8px; }
  .crumbs span { flex: 1; word-break: break-all; color: #ffd54f; }
  .empty { color: #888; padding: 16px; text-align: center; }
  #list input { background: #0e1114; color: #eee; border: 1px solid #4a90d9; border-radius: 4px; padding: 3px 6px; flex: 1; font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
    <header>
        <h1>🧩 QA Field Mapper</h1>
        <div>
          <button id="btn-toggle"></button>
          <button id="btn-export">⬇ Экспорт</button>
          <button id="btn-import">⬆ Импорт</button>
          <input type="file" id="file-import" accept=".json,application/json" hidden>
        </div>
    </header>
  <div class="bar"><input id="search" placeholder="Поиск: лейбл, XPath, бэк-путь…"></div>
  <div id="list"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
